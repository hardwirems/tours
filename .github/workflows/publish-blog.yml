name: Weekly blog article (approval-gated)

# Weekly pipeline with a HUMAN APPROVAL GATE on every post.
#
#   generate → deploy preview → [👤 approve in GitHub] → publish to production
#
# The `publish` job targets the `blog-approval` Environment, which has a required
# reviewer. GitHub pauses there and emails the reviewer an Approve/Reject request
# with a link to the preview; NOTHING goes live until a human approves.
#
# Scheduled runs additionally require the repo variable BLOG_AUTOMATION_ENABLED=true
# (Stage 2, after approval). Until it is 'true', the weekly run no-ops. A manual
# run (workflow_dispatch) always generates a preview for review, and still cannot
# publish without a human approving the gate.
on:
  schedule:
    # 14:00 UTC Wednesday ≈ 08:00 in America/Costa_Rica (UTC-6). One run per week.
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      auto_only:
        description: 'Restrict to evergreen (riskTier=auto) topics'
        type: boolean
        default: true

concurrency:
  group: publish-blog
  cancel-in-progress: false

jobs:
  # --- 1. Generate a draft, gate it, deploy a preview ----------------------
  generate:
    runs-on: ubuntu-latest
    # Scheduled runs require the enable flag; manual runs may always build a preview.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.BLOG_AUTOMATION_ENABLED == 'true' }}
    outputs:
      candidate: ${{ steps.gen.outputs.candidate }}
      slug: ${{ steps.gen.outputs.slug }}
      title: ${{ steps.gen.outputs.title }}
      preview_url: ${{ steps.preview.outputs.url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}   # only needed for an org-level (unscoped) key
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      BLOG_TZ: ${{ vars.BLOG_TZ }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y webp   # cwebp for image optimization
      - run: npm ci
      - name: Generate + gate draft
        id: gen
        run: node automation/publish.mjs ${{ (github.event_name == 'schedule' || github.event.inputs.auto_only == 'true') && '--auto-only' || '' }}
      - name: Archive the generated draft (even if it failed a gate)
        if: always() && steps.gen.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-draft
          retention-days: 14
          path: content/blog/${{ steps.gen.outputs.slug }}.ts
      - name: Deploy preview (drafts visible)
        id: preview
        if: steps.gen.outputs.candidate == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages deploy dist/ --project-name guanacaste-experiences --branch blog-preview 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(echo "$out" | grep -oE 'https://[a-z0-9]+\.guanacaste-experiences\.pages\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Save approved-draft artifact
        if: steps.gen.outputs.candidate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blog-draft
          retention-days: 14
          path: |
            content/blog/${{ steps.gen.outputs.slug }}.ts
            content/blog/index.ts
            public/images/blog/
            automation/state.json
      - name: Review summary
        if: steps.gen.outputs.candidate == 'true'
        run: |
          {
            echo "## 📝 Blog article awaiting your approval"
            echo ""
            echo "**${{ steps.gen.outputs.title }}**"
            echo ""
            echo "- Preview: ${{ steps.preview.outputs.url }}/blog/${{ steps.gen.outputs.slug }}/"
            echo "- Passed the quality, SEO and built-HTML gates."
            echo ""
            echo "➡️ **Approve the \`publish\` job** below to make it live; reject to discard (nothing is committed to \`main\` unless you approve)."
          } >> "$GITHUB_STEP_SUMMARY"

  # --- 2. Publish — gated on a human approval in GitHub --------------------
  publish:
    needs: generate
    if: needs.generate.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the approved, published post to main
    environment:
      name: blog-approval               # ← required reviewer; GitHub emails them + waits
      url: ${{ needs.generate.outputs.preview_url }}/blog/${{ needs.generate.outputs.slug }}/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BLOG_TZ: ${{ vars.BLOG_TZ }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y webp
      - run: npm ci
      - name: Restore the approved draft
        uses: actions/download-artifact@v4
        with: { name: blog-draft, path: . }
      - name: Promote + deploy to production
        run: node automation/publish.mjs --promote ${{ needs.generate.outputs.slug }}
      - name: Commit the published post to main
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          git add content/blog public/images/blog automation/state.json automation/runs.log public/sitemap.xml public/blog-rss.xml || true
          git commit -m "content(blog): publish '${{ needs.generate.outputs.title }}' (human-approved)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
      - name: Surface an alert on failure
        if: failure()
        run: echo "::error::Approved article failed to publish/deploy — see automation/runs.log."
