name: Refresh transfer inventory (approval-gated)

# Weekly refresh of the Viator transfer inventory, mirroring the blog automation:
#   refresh (re-fetch + validate + preview) → [👤 approve in GitHub] → deploy to prod
#
# The `deploy` job targets the `transport-approval` Environment (required reviewer),
# so a human approves before anything reaches production. Only runs on schedule
# when the repo variable TRANSPORT_REFRESH_ENABLED=true. A refresh that produces
# NO changes, fails a gate, or trips the sync safety floor never requests approval.
on:
  schedule:
    - cron: '0 15 * * 1'   # Mondays 15:00 UTC ≈ 09:00 America/Costa_Rica
  workflow_dispatch:

concurrency:
  group: refresh-transfers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.TRANSPORT_REFRESH_ENABLED == 'true' }}
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      preview_url: ${{ steps.preview.outputs.url }}
    env:
      VIATOR_API_KEY: ${{ secrets.VIATOR_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y webp
      - run: npm ci
      - name: Re-fetch + curate inventory
        id: sync
        run: |
          SUMMARY_OUT="$RUNNER_TEMP/summary.txt" node scripts/sync-transfers.mjs
          if git diff --quiet lib/transportation-data.ts lib/affiliate-transfers.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No inventory changes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            { echo "## 🔄 Transfer inventory changed"; echo ""; sed 's/^/- /' "$RUNNER_TEMP/summary.txt"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate (source gate)
        if: steps.sync.outputs.changed == 'true'
        run: node automation/validate-transportation.mjs
      - name: Build
        if: steps.sync.outputs.changed == 'true'
        run: npm run build:web
      - name: Validate (built-HTML gate)
        if: steps.sync.outputs.changed == 'true'
        run: node automation/validate-transportation.mjs --dist dist
      - name: Deploy preview
        id: preview
        if: steps.sync.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages deploy dist/ --project-name guanacaste-experiences --branch transport-preview 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          echo "url=$(echo "$out" | grep -oE 'https://[a-z0-9-]+\.guanacaste-experiences\.pages\.dev' | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Save refreshed data
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transfer-data
          retention-days: 14
          path: |
            lib/transportation-data.ts
            lib/affiliate-transfers.ts

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: transport-approval          # ← required reviewer; GitHub emails + waits
      url: ${{ needs.refresh.outputs.preview_url }}/transportation/airport-transfers/lir/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y webp
      - run: npm ci
      - name: Restore approved data
        uses: actions/download-artifact@v4
        with: { name: transfer-data, path: . }
      - name: Build + deploy to production
        run: |
          npm run build:web
          npx wrangler pages deploy dist/ --project-name guanacaste-experiences --branch main
      - name: Verify production
        run: |
          BASE="https://www.guanacasteexperiences.com"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/transportation/airport-transfers/lir/")
          go=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/go/viator/private-transfer-liberia-airport")
          echo "LIR page: $code | /go: $go"
          [ "$code" = "200" ] && [ "$go" = "302" ] || { echo "::error::production verification failed"; exit 1; }
      - name: Commit refreshed data to main
        run: |
          git config user.name "transfer-bot"
          git config user.email "transfer-bot@users.noreply.github.com"
          git add lib/transportation-data.ts lib/affiliate-transfers.ts
          git commit -m "chore(transportation): weekly Viator inventory refresh (approved)" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
